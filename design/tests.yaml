dna: dna-smartbuy.md
pieza: "http://localhost:8001/?buscar=Cable%20USB4%20confiable"   # necesita el servidor con PORT=8001
anchos: [1280, 390]
alto: 900
espera_ms: 45000

tests:
  - id: 1
    dice: Todo font-weight es 400, 500 o 600
    tipo: css-valores
    propiedad: font-weight
    permitidos: ["400", "500", "600", "normal", "inherit"]

  - id: 2
    dice: Solo IBM Plex Sans, IBM Plex Mono y la pila de sistema
    tipo: css-familias
    permitidas: ["IBM Plex Sans", "IBM Plex Mono", system-ui, "-apple-system", "Segoe UI", sans-serif, monospace, ui-monospace, inherit]

  - id: 3
    dice: No queda el papel cálido anterior
    tipo: css-colores
    prohibidos: ["#fdfcfc", "#f5f3f1", "#ebe8e4"]

  - id: 4
    dice: No queda el naranja anterior
    tipo: css-colores
    prohibidos: ["#e8502a", "#ff6a3d"]
  - id: 4
    dice: Botones, pestañas y enlaces sin color saturado
    tipo: js
    expr: |
      return (() => {
        const sat = c => { const m = c.match(/\d+(\.\d+)?/g); if (!m) return 0; const [r,g,b] = m.map(Number); const mx = Math.max(r,g,b), mn = Math.min(r,g,b); return mx === 0 ? 0 : (mx-mn)/mx; };
        const bad = [...document.querySelectorAll('button, a, .tabs button')].filter(e => e.offsetParent).filter(e => {
          const s = getComputedStyle(e); return sat(s.backgroundColor) > 0.25 || sat(s.color) > 0.25 || sat(s.borderTopColor) > 0.25; });
        return { ok: bad.length === 0, detalle: bad.slice(0,5).map(e => e.outerHTML.slice(0,80)).join(' | ') };
      })()

  - id: 5
    dice: Ningún button tiene radio mayor a 4 px
    tipo: estilo
    selector: button
    propiedades: {border-top-left-radius: {max: 4}}
    cuantos: todos

  - id: 6
    dice: Filas y bandas con radio <= 4 px y sin sombra
    tipo: js
    expr: |
      return (() => {
        const els = [...document.querySelectorAll('.card, .sl, .discard, .table-wrap, .chat-composer')];
        const bad = els.filter(e => parseFloat(getComputedStyle(e).borderTopLeftRadius) > 4 || getComputedStyle(e).boxShadow !== 'none');
        return { ok: els.length > 0 && bad.length === 0, detalle: `${els.length} filas, ${bad.length} malas` };
      })()

  - id: 7
    dice: Inputs del formulario radio 2 px y borde #666b74
    tipo: estilo
    selector: "#form input:not([type=checkbox]):not([type=range]), #form select, .variant select"
    propiedades: {border-top-left-radius: "2px", border-top-color: "#666b74"}
    cuantos: todos
  - id: 7
    dice: Cuadro del asistente con texto de 16 px
    tipo: estilo
    selector: "#chat-input"
    propiedades: {font-size: "16px"}
  - id: 7
    dice: Cuadro del asistente radio 2 px
    tipo: estilo
    selector: "#chat-input"
    propiedades: {border-top-left-radius: "2px"}

  - id: 8
    dice: Cada pestaña abre con h2.panel-title Plex 600 28 px
    tipo: js
    expr: |
      return (() => {
        const tabs = [...document.querySelectorAll('.tab')];
        const bad = tabs.filter(t => { const h = t.querySelector('h2.panel-title'); if (!h) return true; const s = getComputedStyle(h); return s.fontWeight !== '600' || s.fontSize !== '28px' || !/IBM Plex Sans/.test(s.fontFamily); });
        return { ok: tabs.length >= 5 && bad.length === 0, detalle: `${tabs.length} pestañas, sin titular correcto: ${bad.map(t => t.id).join(', ')}` };
      })()

  - id: 9
    dice: Fondo del body blanco
    tipo: estilo
    selector: body
    propiedades: {background-color: "#ffffff"}
  - id: 9
    dice: Filas de producto sin fondo y con línea superior
    tipo: js
    expr: |
      return (() => { document.querySelector('.tabs button[data-tab=ranking]')?.click();
        const c = document.querySelector('.card'); if (!c) return { ok: false, detalle: 'sin tarjetas' };
        const s = getComputedStyle(c); return { ok: s.backgroundColor === 'rgba(0, 0, 0, 0)' && parseFloat(s.borderTopWidth) >= 1, detalle: s.backgroundColor + ' / ' + s.borderTopWidth }; })()

  - id: 10
    dice: Ninguna sombra
    tipo: css-rango
    propiedad: box-shadow
    max: 1

  - id: 11
    dice: Pestaña activa con línea ink de 2 px; ninguna con fondo
    tipo: js
    expr: |
      return (async () => { await new Promise(r => setTimeout(r, 400)); const bs = [...document.querySelectorAll('.tabs button')];
        const a = bs.find(b => b.classList.contains('active')); const s = getComputedStyle(a);
        const filled = bs.filter(b => !['rgba(0, 0, 0, 0)', 'transparent'].includes(getComputedStyle(b).backgroundColor));
        return { ok: s.borderBottomWidth === '2px' && s.borderBottomColor === 'rgb(21, 23, 27)' && filled.length === 0, detalle: s.borderBottomWidth + ' / ' + s.borderBottomColor + ' / con fondo: ' + filled.length }; })()

  - id: 12
    dice: Como máximo un botón relleno ink visible en el área principal por pestaña
    tipo: js
    expr: |
      return (() => { const res = [];
        for (const name of ['assistant','ranking','compare','discarded','shortlist']) {
          document.querySelector(`.tabs button[data-tab=${name}]`)?.click();
          const n = [...document.querySelectorAll(`#tab-${name} button`)].filter(b => b.offsetParent && getComputedStyle(b).backgroundColor === 'rgb(21, 23, 27)').length;
          if (n > 1 && name !== 'ranking' && name !== 'shortlist') res.push(`${name}: ${n}`); }
        document.querySelector('.tabs button[data-tab=assistant]')?.click();
        return { ok: res.length === 0, detalle: res.join(', ') || 'ok' }; })()
    nota: En Ranking y Lista corta cada tarjeta puede tener su acción; se revisa a juicio que no compitan.

  - id: 13
    dice: Precios y puntajes en IBM Plex Mono
    tipo: js
    expr: |
      return (() => { document.querySelector('.tabs button[data-tab=ranking]')?.click();
        const els = [...document.querySelectorAll('.total, .score-num')];
        const bad = els.filter(e => !/IBM Plex Mono/.test(getComputedStyle(e).fontFamily));
        document.querySelector('.tabs button[data-tab=assistant]')?.click();
        return { ok: els.length > 0 && bad.length === 0, detalle: `${els.length} cifras, ${bad.length} sin mono` }; })()

  - id: 14
    dice: En modo oscuro el canvas es #0b0c0f
    tipo: js
    expr: |
      return (() => { const css = [...document.styleSheets].flatMap(s => { try { return [...s.cssRules]; } catch { return []; } }).map(r => r.cssText).join(' ');
        return { ok: /prefers-color-scheme:\s*dark[\s\S]*--canvas:\s*#0b0c0f/i.test(css), detalle: 'regla de modo oscuro' }; })()

  - id: 15
    dice: El acento solo en puntos de 6 px y en el número del primer lugar
    tipo: js
    expr: |
      return (() => { document.querySelector('.tabs button[data-tab=ranking]')?.click();
        const sem = ['rgb(189, 69, 11)'];
        const bad = [...document.querySelectorAll('body *')].filter(e => e.offsetParent && !e.matches('.card.top .rank')).filter(e => { const s = getComputedStyle(e);
          return sem.includes(s.color) || (sem.includes(s.backgroundColor) && (parseFloat(s.width) > 8 || parseFloat(s.height) > 8)); });
        document.querySelector('.tabs button[data-tab=assistant]')?.click();
        return { ok: bad.length === 0, detalle: bad.slice(0,4).map(e => e.className || e.tagName).join(', ') }; })()

  - id: 16
    dice: A 390 px no hay scroll horizontal
    tipo: sin-scroll-horizontal
    ancho: 390
  - id: 16
    dice: A 390 px el panel de filtros queda bajo el área principal
    tipo: js
    ancho: 390
    expr: |
      return (() => { const p = document.querySelector('.panel').getBoundingClientRect(), m = document.querySelector('main').getBoundingClientRect();
        return { ok: p.top >= m.top, detalle: `panel ${Math.round(p.top)} / main ${Math.round(m.top)}` }; })()

  - id: 17
    dice: El cuadro del asistente mide >= 72 px de alto y ocupa el ancho de la conversación
    tipo: js
    expr: |
      return (() => { const i = document.querySelector('#chat-input').getBoundingClientRect(), c = document.querySelector('.chat').getBoundingClientRect();
        return { ok: i.height >= 72 && i.width >= c.width * 0.7, detalle: `${Math.round(i.width)}×${Math.round(i.height)} en ${Math.round(c.width)}` }; })()
